<body>
<div id="app"></div>
<div id="layer"></div>
<div id="dlg"></div>
<div id="toast"></div>
<div id="busy" class="busy" style="display:none"></div>
<!-- 기기별 앱 설치 및 브라우저 안내 배너 -->
<div id="install-banner" style="display:none" role="dialog" aria-live="polite">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
    <div style="flex:1"><div id="install-title" class="ib-t"></div><div id="install-desc" class="ib-d"></div></div>
    <button type="button" class="ib-x" onclick="dismissInstallBanner()" aria-label="닫기">✕</button>
  </div>
  <div id="install-action-wrap" style="display:none"><button id="install-action-btn" type="button" class="ib-btn"></button></div>
</div>
<script>
  (function () {
    var deferredPrompt = null;
    var banner = document.getElementById('install-banner');
    var titleEl = document.getElementById('install-title');
    var descEl = document.getElementById('install-desc');
    var actionWrap = document.getElementById('install-action-wrap');
    var actionBtn = document.getElementById('install-action-btn');
    // 카톡 안이나 사생활 보호 모드에서는 저장 공간을 쓰다 오류가 날 수 있어서 감싸요
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

    // 지금 앱 이름 (아이폰 홈 화면 이름과 같아요)
    var appNameMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    var APP_NAME = appNameMeta ? appNameMeta.getAttribute('content') : '';

    window.dismissInstallBanner = function () {
      banner.style.display = 'none';
      lsSet('hide_pwa_banner_v1', '1');
      lsSet('pwa_name', APP_NAME);
    };

    // 이미 홈 화면 앱(standalone)으로 실행 중이거나 닫기를 눌렀으면 표시 안 함
    var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (isStandalone) {
      // 앱 이름이 바뀐 뒤 예전 아이콘으로 연 사람에게만 한 번 알려요.
      // (홈 화면 아이콘 이름은 휴대폰이 추가할 때 정해서, 웹에서 바꿀 수 없어요)
      // 예전에 쓰던 기록(jgb:)이 있는데 이름 기록이 다르면 = 예전 이름으로 추가한 아이콘
      var used = false;
      try { for (var i = 0; i < localStorage.length; i++) if (String(localStorage.key(i)).indexOf('jgb:') === 0) { used = true; break; } } catch (e) { }
      var seen = lsGet('pwa_name');
      if (used && seen !== APP_NAME && APP_NAME) {
        showBanner(
          '앱 이름이 "' + APP_NAME + '"(으)로 바뀌었어요',
          '홈 화면 아이콘 이름은 저절로 바뀌지 않아요. 아이콘을 길게 눌러 <b>삭제</b>한 뒤, 브라우저에서 이 주소를 열고 다시 <b>[홈 화면에 추가]</b>해 주세요. 다시 로그인하면 기록은 그대로예요.',
          '알겠어요',
          function () { window.dismissInstallBanner(); }
        );
      } else lsSet('pwa_name', APP_NAME);
      return;
    }
    lsSet('pwa_name', APP_NAME);
    if (lsGet('hide_pwa_banner_v1') === '1' || lsGet('hideInstallGuide') === '1') return;

    var ua = navigator.userAgent || '';
    var isKakao = /KAKAOTALK/i.test(ua);
    // iPadOS 13+는 스스로를 Mac이라고 알려서 터치 여부로 함께 봐요
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isIOSSafari = isIOS && !/CriOS|FxiOS|EdgiOS|NAVER|KAKAOTALK|Instagram|FBAN|Line/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    function showBanner(title, desc, btnText, onClick) {
      titleEl.textContent = title;
      descEl.innerHTML = desc;
      if (btnText && onClick) {
        actionBtn.textContent = btnText;
        actionBtn.onclick = onClick;
        actionWrap.style.display = 'block';
      } else {
        actionWrap.style.display = 'none';
      }
      banner.style.display = 'block';
    }

    // 1순위: 카카오톡 인앱 브라우저 → 외부 브라우저로 (로그인 유지 및 카메라 촬영)
    if (isKakao) {
      showBanner(
        '기본 브라우저로 열어 주세요',
        '카톡 안에서는 로그인이 풀리거나 인증 사진 첨부가 막힐 수 있어요.',
        '크롬 / 사파리로 열기',
        function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); }
      );
      return;
    }

    // 2순위: 갤럭시/안드로이드 크롬·삼성 인터넷 원클릭 설치 (브라우저가 허락할 때만 이벤트가 와요)
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      showBanner(
        'High-Light 앱 설치하기',
        '홈 화면에 앱을 설치하면 주소창 없이 더 빠르고 편하게 쓸 수 있어요.',
        '지금 바로 앱 설치',
        function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (res) {
            deferredPrompt = null;
            if (res.outcome === 'accepted') window.dismissInstallBanner();
          });
        }
      );
    });
    window.addEventListener('appinstalled', function () { window.dismissInstallBanner(); });

    // 3순위: 아이폰 홈 화면 추가 안내
    if (isIOS) {
      showBanner(
        '아이폰 홈 화면에 앱 추가하기',
        isIOSSafari
          ? '화면 아래 <b>공유 버튼(□↑)</b>을 누른 뒤 <b>[홈 화면에 추가]</b>를 고르면 앱처럼 실행돼요!'
          : '<b>사파리</b>로 열어서 화면 아래 <b>공유 버튼(□↑)</b> → <b>[홈 화면에 추가]</b>를 고르면 앱처럼 실행돼요!',
        null, null
      );
      return;
    }

    // 4순위: 설치 이벤트가 늦거나 없는 안드로이드 브라우저 안내
    if (isAndroid) {
      setTimeout(function () {
        if (!deferredPrompt && banner.style.display === 'none') {
          showBanner(
            '갤럭시 홈 화면에 추가하기',
            '브라우저 메뉴(<b>⋮</b> 또는 <b>≡</b>) → <b>[홈 화면에 추가]</b>를 누르면 앱처럼 바로 열려요!',
            null, null
          );
        }
      }, 2500);
    }
  })();
</script>

     '지금부터 시작'은 오늘부터, '끝내기'는 어제까지로 기록해요. (끝 날짜가 비어 있으면 계속 진행 중) */
  function specialDawnConfig(S, today) {
    var cfg = {}, upd = {};
    S.all('settings').forEach(function (x) { cfg[x.key] = x.value; upd[x.key] = x.updatedAt || ''; });
    var from = isDate(cfg.specialDawnFrom || '') ? cfg.specialDawnFrom : '';
    var to = isDate(cfg.specialDawnTo || '') ? cfg.specialDawnTo : '';
    if (cfg.specialDawn === '1' && !from) from = isDate(upd.specialDawn.slice(0, 10)) ? upd.specialDawn.slice(0, 10) : today; // 예전 '항상 켜기' 설정
    var title = cfg.specialDawnTitle || '특별새벽기도회';
    var active = !!from && today >= from && (!to || today <= to);
    return {
      active: active, from: from, to: to, title: title,
      open: !!from && !to, upcoming: !!from && from > today, ended: !!to && to < today,
      multiplier: active ? 2 : 1
    };
  }

  /* ---------- 기간 이벤트: QT 2배(qtX2) · 시험 응원(exam) — 특새처럼 시작/기간/끝 ---------- */
  var RANGE_KINDS = { qtX2: 'QT 2배 이벤트', exam: '시험 응원 기간' };
  function rangeConfig(S, today, kind) {
    var cfg = {}; S.all('settings').forEach(function (x) { cfg[x.key] = x.value; });
    var from = isDate(cfg[kind + 'From'] || '') ? cfg[kind + 'From'] : '', to = isDate(cfg[kind + 'To'] || '') ? cfg[kind + 'To'] : '';
    var active = !!from && today >= from && (!to || today <= to);
    return { active: active, from: from, to: to, title: cfg[kind + 'Title'] || RANGE_KINDS[kind], open: !!from && !to, upcoming: !!from && from > today, ended: !!to && to < today };
  }
  function inRange(cfg, date) { return !!cfg.from && date >= cfg.from && (!cfg.to || date <= cfg.to); }
  function rangeSave(S, me, p) {
    if (!isAdmin(S, me)) throw userError('이벤트 설정은 교역자만 할 수 있어요.');
    var kind = p.kind, today = S.today(), now = S.now();
    var rows = S.all('settings');
    if (kind === 'suneung') { // 수능 날짜 (비우면 수능 응원이 꺼져요)
      var sd = clean(p.date);
      if (sd && !isDate(sd)) throw userError('수능 날짜를 확인해 주세요.');
      rows = rows.filter(function (x) { return x.key !== 'suneungDate'; });
      rows.push({ key: 'suneungDate', value: sd, updatedAt: now });
      S.save('settings', rows); return;
    }
    if (!RANGE_KINDS[kind]) throw userError('알 수 없는 요청이에요.');
    var cur = rangeConfig(S, today, kind), title = clean(p.title, 30) || cur.title, from = '', to = '';
    if (p.op === 'start') { from = today; }
    else if (p.op === 'range') {
      from = clean(p.from); to = clean(p.to);
      if (!isDate(from)) throw userError('시작 날짜를 확인해 주세요.');
      if (to && !isDate(to)) throw userError('끝 날짜를 확인해 주세요.');
      if (to && to < from) throw userError('끝 날짜가 시작 날짜보다 빨라요.');
    } else if (p.op === 'stop') {
      if (cur.from && cur.from < today) { from = cur.from; to = dAdd(today, -1); }
    } else throw userError('알 수 없는 요청이에요.');
    rows = rows.filter(function (x) { return [kind + 'From', kind + 'To', kind + 'Title'].indexOf(x.key) < 0; });
    rows.push({ key: kind + 'From', value: from, updatedAt: now }, { key: kind + 'To', value: to, updatedAt: now }, { key: kind + 'Title', value: title, updatedAt: now });
    S.save('settings', rows);
  }
  // 수능 응원: 수능 60일 전부터 3일 뒤까지 열려요
  function suneungBlock(S, me, today) {
    var x = S.all('settings').filter(function (r) { return r.key === 'suneungDate'; })[0], d = x && isDate(x.value) ? x.value : '';
    if (!d || today < dAdd(d, -60) || today > dAdd(d, 3)) return d ? { date: d, open: false } : null;
    var year = d.slice(0, 4), members = S.all('members'), cheers = S.all('examCheers').filter(function (c) { return c.year === year; });
    var byId = {}; members.forEach(function (m) { byId[m.id] = m; });
    var seniors = members.filter(function (m) { return m.active === '1' && m.role === 'student' && m.grade === '고3'; });
    var res = {
      date: d, open: true, dday: Math.round((dParse(d) - dParse(today)) / 86400000),
      seniors: seniors.map(function (m) { return { id: m.id, name: nm(S, m.id, m.name), cls: m.cls, avatar: m.avatar || '', count: cheers.filter(function (c) { return c.toId === m.id || !c.toId; }).length }; }),
      sent: cheers.filter(function (c) { return c.fromId === me.id; }).map(function (c) { return { toId: c.toId, message: c.message }; }),
      total: cheers.length
    };
    if (me.role === 'student' && me.grade === '고3') {
      res.received = cheers.filter(function (c) { return c.toId === me.id || !c.toId; }).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; })
        .map(function (c) { var f = byId[c.fromId]; return { from: f ? nm(S, f.id, f.name) : '', avatar: f ? f.avatar || '' : '', role: f ? f.role : '', all: !c.toId, message: c.message, createdAt: c.createdAt }; });
    }
    return res;
  }
  function examCheerSend(S, me, p) {
    var sb = suneungBlock(S, me, S.today());
    if (!sb || !sb.open) throw userError('수능 응원 기간이 아니에요.');
    var toId = clean(p.toId);
    if (toId) {
      var t = S.all('members').filter(function (m) { return m.id === toId && m.active === '1' && m.grade === '고3' && m.role === 'student'; })[0];
      if (!t) throw userError('응원할 고3 친구를 다시 골라 주세요.');
      if (t.id === me.id) throw userError('나에게는 보낼 수 없어요.');
    }
    var msg = clean(p.message, 80);
    if (!meaningful(msg, 4)) throw userError('응원 한마디를 조금 더 적어 주세요.');
    var year = sb.date.slice(0, 4), rows = S.all('examCheers');
    var ex = rows.filter(function (c) { return c.year === year && c.fromId === me.id && c.toId === toId; })[0];
    if (ex) { ex.message = msg; ex.createdAt = S.now(); }
    else rows.push({ id: uid(), toId: toId, fromId: me.id, message: msg, year: year, createdAt: S.now() });
    S.save('examCheers', rows);
  }

  function isSpecialDawnDate(cfg, date) {
    return !!cfg.from && date >= cfg.from && (!cfg.to || date <= cfg.to);
  }

  function specialDawnSave(S, me, p) {
    if (!isAdmin(S, me)) throw userError('특새 2배 이벤트 설정은 교역자만 할 수 있어요.');
    var today = S.today(), cur = specialDawnConfig(S, today);
    var title = clean(p.title, 30) || cur.title || '특별새벽기도회';
    var op = p.op || (flag(p.alwaysOn) ? 'start' : (p.from || p.to) ? 'range' : 'stop');
    var from = '', to = '';
    if (op === 'start') { from = today; to = ''; }
    else if (op === 'range') {
      from = clean(p.from); to = clean(p.to);
      if (!isDate(from)) throw userError('시작 날짜를 확인해 주세요.');
      if (to && !isDate(to)) throw userError('끝 날짜를 확인해 주세요.');
      if (to && to < from) throw userError('끝 날짜가 시작 날짜보다 빨라요.');
    } else if (op === 'stop') {
      if (cur.from && cur.from < today) { from = cur.from; to = dAdd(today, -1); } // 지난 기간은 2배 그대로 남겨요
      else { from = ''; to = ''; }
    } else throw userError('알 수 없는 요청이에요.');
    var rows = S.all('settings').filter(function (x) {
      return ['specialDawn', 'specialDawnFrom', 'specialDawnTo', 'specialDawnTitle'].indexOf(x.key) < 0;
    });
    var now = S.now();
    rows.push({ key: 'specialDawn', value: '', updatedAt: now });
    rows.push({ key: 'specialDawnFrom', value: from, updatedAt: now });
    rows.push({ key: 'specialDawnTo', value: to, updatedAt: now });
    rows.push({ key: 'specialDawnTitle', value: title, updatedAt: now });
    S.save('settings', rows);
  }

  /* ---------- 로그인 ---------- */
  function login(S, p) {
    var name = clean(p.name, 30), pin = clean(p.pin, 20);
    if (!name || !pin) throw userError('이름과 비밀번호를 입력해 주세요.');
    S.guard('login:' + name);
    var activeFound = S.all('members').filter(function (x) {
      return x.active === '1' && x.name === name && pinMatch(S, x, pin);
    });
    if (!activeFound.length) {
      // 가입 신청 후 승인 전이면 알려 줘요
      var pend = S.all('members').some(function (x) { return x.active === 'pending' && x.name === name && pinMatch(S, x, pin); });
      if (pend) throw userError('가입 승인을 기다리고 있어요. 교역자님께 승인 요청해 주세요.');
      S.fail('login:' + name);
      throw userError('이름 또는 비밀번호가 맞지 않아요.');
    }
    var m = activeFound[0];
    if (activeFound.length > 1) {
      m = activeFound.filter(function (x) { return x.id === p.pickId; })[0];
      if (!m) return { pick: activeFound.map(function (x) { return { id: x.id, label: [x.grade, x.cls].filter(Boolean).join(' · ') || (x.role === 'teacher' ? '선생님' : '반 미정') }; }) };
    }
    S.clearFail('login:' + name);
    var fresh = pinHash(S, m.id, pin);
    if (m.pinHash !== fresh) { m.pinHash = fresh; S.save('members', S.all('members')); } // 예전 방식 → 새 방식
    var token = uid() + uid() + uid();
    var limit = Date.now() - SESSION_DAYS * 86400000;
    var sessions = S.all('sessions').filter(function (s) { return Number(s.createdAt) > limit; });
    sessions.push({ token: token, memberId: m.id, createdAt: String(Date.now()) });
    S.save('sessions', sessions);
    return { token: token };
  }

  function authenticate(S, token) {
    if (!token) throw userError('로그인이 필요해요.', 'AUTH');
    var s = S.all('sessions').filter(function (x) { return x.token === token; })[0];
    if (!s || Number(s.createdAt) < Date.now() - SESSION_DAYS * 86400000) throw userError('다시 로그인해 주세요.', 'AUTH');
    var m = S.all('members').filter(function (x) { return x.id === s.memberId && x.active === '1'; })[0];
    if (!m) throw userError('다시 로그인해 주세요.', 'AUTH');
    return m;
  }

  function logout(S, me, p, token) {
    S.save('sessions', S.all('sessions').filter(function (x) { return x.token !== token; }));
    return { ok: true };
  }

  /* ---------- 기도제목 공개 범위 ---------- */
  function canSeePrayer(p, me, admin) {
    if (p.memberId === me.id) return true;
    if (me.role === 'teacher') {
      if (p.visibility === 'private') return false;
      if (p.visibility === 'all') return true;
      return admin || (!!me.cls && p.cls === me.cls);
    }
    if (p.visibility === 'all') return true;
    if (p.visibility === 'class') return !!me.cls && p.cls === me.cls;
    return false;
  }

  function prayerView(S, p, me, names, avatars) {
    var ids = p.prayedBy ? p.prayedBy.split(',').filter(Boolean) : [];
    var mine = p.memberId === me.id;
    var anon = p.anonymous === '1';
    var name = nm(S, p.memberId, names[p.memberId] || p.authorName || '');
    return {
      id: p.id, content: p.content, visibility: p.visibility, cls: p.cls, createdAt: p.createdAt,
      mine: mine, anonymous: anon,
      authorName: anon && !mine && me.role !== 'teacher' ? '익명' : name,
      authorAvatar: anon && !mine ? '' : (avatars[p.memberId] || ''),
      prayCount: ids.length, prayed: ids.indexOf(me.id) >= 0, kind: p.kind || ''
    };
  }

  /* ---------- 2주 연속 주일 결석자 추출 ---------- */
  function extractAbsentAlert(members, att, sunDates, me, adminFlag, today) {
    // 주일 당일에는 예배가 아직 진행 중이라 오늘은 빼고 지난 두 주로 봐요 (아침에 아직 출석 안 한 학생이 잘못 뜨지 않게)
    if (today && sunDates.length && sunDates[sunDates.length - 1] === today) sunDates = sunDates.slice(0, -1);
    if (sunDates.length < 2) return [];
    var last1 = sunDates[sunDates.length - 1];
    var last2 = sunDates[sunDates.length - 2];
    var sunPresent = {};
    att.forEach(function (a) {
      if (svc(a) === 'sun') (sunPresent[a.date] = sunPresent[a.date] || {})[a.memberId] = true;
    });

    var alerts = [];
    members.forEach(function (m) {
      if (m.active !== '1' || m.role !== 'student') return;
      if (!adminFlag && (!me.cls || m.cls !== me.cls)) return;
      var reg = (m.createdAt || '').slice(0, 10);
      if (isDate(reg) && reg > last2) return; // 최근 2주 내 신규 등록 학생은 제외
      var p1 = sunPresent[last1] && sunPresent[last1][m.id];
      var p2 = sunPresent[last2] && sunPresent[last2][m.id];
      if (!p1 && !p2) {
        var lastSeen = '';
        for (var i = sunDates.length - 3; i >= 0; i--) {
          if (sunPresent[sunDates[i]] && sunPresent[sunDates[i]][m.id]) {
            lastSeen = sunDates[i];
            break;
          }
        }
        alerts.push({
          id: m.id,
          name: m.name,
          grade: m.grade || '',
          cls: m.cls || '',
          avatar: m.avatar || '',
          phone: m.phone || '',
          parentPhone: m.parentPhone || '',
          missedDates: [last2, last1],
          lastSeen: lastSeen
        });
      }
    });
    return alerts.sort(function (a, b) {
      return (a.cls || 'ㅎ') < (b.cls || 'ㅎ') ? -1 : (a.cls || 'ㅎ') > (b.cls || 'ㅎ') ? 1 : (a.name < b.name ? -1 : 1);
    });
  }

  /* ---------- 처음 화면에 필요한 데이터 ---------- */
  function bootstrap(S, me) {
    var isTeacher = me.role === 'teacher';
    var adminFlag = isAdmin(S, me);
    var today = S.today();
    var since = dAdd(today, -400);
    var prayerSince = dAdd(today, -90); // 기도제목은 최근 90일 이내만 로딩
    var members = S.all('members');
    var names = {}, studentIds = {}, avatars = {};
    members.forEach(function (m) { names[m.id] = m.name; avatars[m.id] = m.avatar || ''; if (m.role === 'student') studentIds[m.id] = true; });
    var att = S.all('attendance').filter(function (a) { return a.date >= since; });
    var dateSet = {};
    att.forEach(function (a) { if (studentIds[a.memberId] && svc(a) === 'sun') dateSet[a.date] = true; });
    var sortedSunDates = Object.keys(dateSet).sort();
    var nowStamp = S.now();
    var todayCodes = S.all('codes').filter(function (c) { return c.date === today && pickService(c.service) === 'sun' && codeLive(c, nowStamp); });
    var code = todayCodes[0];

    var byDateDesc = function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; };
    var res = {
      me: memberView(me, true),
      coreVersion: VERSION,
      today: today,
      serviceDates: sortedSunDates,
      codeOpen: !!code,
      specialDawn: specialDawnConfig(S, today),
      qtDouble: rangeConfig(S, today, 'qtX2'),
      exam: rangeConfig(S, today, 'exam'),
      bulletins: S.all('bulletins').slice().sort(byDateDesc),
      // 공지 사진은 드라이브 파일ID 대신 있는지만 알려 주고, 화면에서 noticePhoto 로 따로 불러와요
      notices: S.all('notices').slice().sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; })
        .map(function (x) {
          var o = {}; Object.keys(x).forEach(function (k) { if (k !== 'photo') o[k] = x[k]; }); o.hasPhoto = !!x.photo;
          var au = members.filter(function (m) { return m.id === x.authorId; })[0];
          o.byOfficer = !!(au && au.role === 'student'); // 학생이 쓴 공지 = 임원 공지
          return o;
        }),
      events: S.all('events').slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }),
      prayers: S.all('prayers')
        .filter(function (p) { return (p.createdAt || '').slice(0, 10) >= prayerSince && canSeePrayer(p, me, adminFlag); })
        .map(function (p) { return prayerView(S, p, me, names, avatars); })
        .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; })
    };
    res.qt = qtBlock(S, me);
    var led = talentLedger(S);
    res.talent = talentBlock(S, me, led);
    res.mealSlots = mealSlotsView(S, me);
    res.mealFriendFee = mealFriendFee(S);
    res.perm = { admin: adminFlag, cls: me.cls || '' };
    res.birthdays = birthdayBlock(S, me);
    res.newcomer = newcomerInfo(S, me, today);
    res.suneung = suneungBlock(S, me, today);
    res.polls = pollsView(S, me, today);
    if (adminFlag) {
      res.leaveRequests = members.filter(function (m) { return m.leaveReq && m.active !== 'pending'; })
        .map(function (m) { return { id: m.id, name: nm(S, m.id, m.name), role: m.role, grade: m.grade, cls: m.cls, avatar: m.avatar || '', leaveReq: m.leaveReq, leaveReason: m.leaveReason || '' }; });
      res.pastorJoinCode = getPastorCode(S);
      res.pendingMembers = members.filter(function (m) { return m.active === 'pending'; })
        .map(function (m) { return memberView(m, true); })
        .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
    }
    if (isTeacher) {
      res.absentAlert = extractAbsentAlert(members, att, sortedSunDates, me, adminFlag, today);
      res.absentAlert.forEach(function (a) { a.name = nm(S, a.id, a.name); });
      // 결석 친구 연락 기록: 결석이 시작된 주일부터 남긴 기록을 붙여요
      var clog = S.all('contactLog');
      res.absentAlert.forEach(function (a) {
        a.contacts = clog.filter(function (c) { return c.memberId === a.id && c.createdAt.slice(0, 10) >= a.missedDates[0]; })
          .sort(function (x, y) { return x.createdAt < y.createdAt ? 1 : -1; }).slice(0, 5)
          .map(function (c) { return { method: c.method, memo: c.memo, by: c.by, mine: c.byId === me.id, createdAt: c.createdAt }; });
      });
      res.newcomers = members.filter(function (m) { return m.active === '1'; }).map(function (m) {
        var n = newcomerInfo(S, m, today); if (!n) return null;
        return { id: m.id, name: nm(S, m.id, m.name), cls: m.cls, grade: m.grade, avatar: m.avatar || '', reg: n.reg, days: n.days, count: n.count, goal: n.goal, doneDate: n.doneDate, isNew: n.isNew };
      }).filter(Boolean);
      var promoted = S.all('settings').filter(function (x) { return x.key === 'promotedYear'; })[0];
      res.promotedYear = promoted ? promoted.value : '';
      var qs = qtStats(S, today).byMember;
      var sunDates = sortedSunDates.slice(-4);
      var sunIdx = {}; att.forEach(function (a) { if (svc(a) === 'sun') (sunIdx[a.date] = sunIdx[a.date] || {})[a.memberId] = 1; });
      var cb = {};
      members.forEach(function (m) {
        if (m.active !== '1' || m.role !== 'student') return;
        var k = m.cls || '반 미정', c = cb[k] = cb[k] || { cls: k, n: 0, att: 0, attN: 0, qtW: 0, qtT: 0, talent: 0 };
        var reg = (m.createdAt || '').slice(0, 10);
        c.n++;
        sunDates.forEach(function (d) { if (!reg || d >= reg) { c.attN++; if (sunIdx[d] && sunIdx[d][m.id]) c.att++; } });
        var q = qs[m.id]; if (q) { c.qtW += q.week; c.qtT += q.weekTotal; }
        c.talent += (led[m.id] || { earned: 0 }).earned;
      });
      res.classBoard = Object.keys(cb).sort().map(function (k) { var c = cb[k]; return { cls: c.cls, n: c.n, attRate: c.attN ? c.att / c.attN : null, qtRate: c.qtT ? c.qtW / c.qtT : null, talent: c.talent }; });
    }
    var notes = S.all('sermonNotes');
    res.sermon = {
      mine: notes.filter(function (n) { return n.memberId === me.id; }).map(function (n) { return { date: n.date, line1: n.line1, line2: n.line2, line3: n.line3 }; }),
      openDate: (function () { var d = dow(today) === 0 ? today : dAdd(today, -dow(today)); return d; })()
    };
    if (isTeacher) {

  /* ---------- 오늘의 QT ---------- */
  var QT_RATE_DAYS = 24;
  function qtStats(S, today) {
    var members = S.all('members'), logs = S.all('qtLogs');
    var planDates = S.all('qtPlans').map(function (p) { return p.date; })
      .filter(function (d) { return d <= today && dow(d) !== 0; }).sort();
    var done = {};
    logs.forEach(function (l) { (done[l.memberId] = done[l.memberId] || {})[l.date] = true; });
    var ws = weekStart(today);
    var weekPlans = planDates.filter(function (d) { return d >= ws; });
    var out = {};
    members.forEach(function (m) {
      if (m.active !== '1') return;
      var mine = done[m.id] || {}, reg = (m.createdAt || '').slice(0, 10);
      var streak = 0;
      for (var i = planDates.length - 1; i >= 0; i--) {
        var d = planDates[i];
        if (mine[d]) streak++;
        else if (d === today) continue;
        else break;
      }
      var recent = planDates.filter(function (d) { return d >= reg && d !== today; }).slice(-QT_RATE_DAYS);
      if (mine[today] && planDates.indexOf(today) >= 0) recent = recent.concat([today]);
      var cnt = recent.filter(function (d) { return mine[d]; }).length;
      var total = Object.keys(mine).length;
      out[m.id] = {
        streak: streak, rate: recent.length ? cnt / recent.length : null, rateDays: recent.length,
        week: weekPlans.filter(function (d) { return mine[d]; }).length, weekTotal: weekPlans.length,
        total: total, today: !!mine[today]

    });
    return { byMember: out, planDates: planDates };
  }

  function qtBlock(S, me) {
    var today = S.today(), members = S.all('members');

    var plans = S.all('qtPlans');
    var plan = plans.filter(function (p) { return p.date === today; })[0] || null;
    var st = qtStats(S, today);
    var feedFrom = dAdd(today, -8);
    var logs = S.all('qtLogs').filter(function (l) { return l.date >= feedFrom && byId[l.memberId]; })

    });
    var feedPlans = plans.filter(function (p) { return p.date >= feedFrom && p.date <= today; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var res = {
      today: today, sunday: dow(today) === 0, plan: plan, feedPlans: feedPlans, logs: logs,

    }

  }

  /* ---------- 생일 ---------- */
  function bdayIn(year, birth) {
    var md = birth.slice(5, 10);
    if (md === '02-29' && !(year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0))) md = '02-28';
    return year + '-' + md;
  }
  function birthdayBlock(S, me) {
    var today = S.today(), y = +today.slice(0, 4), ws = dAdd(today, -dow(today)), we = dAdd(ws, 6);
    var cheers = S.all('cheers'), members = S.all('members');
    var byId = {}; members.forEach(function (m) { byId[m.id] = m; });
    var list = [];
    members.forEach(function (m) {
      if (m.active !== '1' || !isDate(m.birth || '')) return;
      if (me.role === 'student' && m.role === 'teacher' && m.id !== me.id) return; // 학생은 교사·교역자 생일을 볼 수 없어요
      [y - 1, y, y + 1].forEach(function (yy) {

        if (d >= ws && d <= we) {
          var cs = cheers.filter(function (c) { return c.toId === m.id && c.year === String(yy); });
          list.push({ id: m.id, name: nm(S, m.id, m.name), cls: m.cls, avatar: m.avatar || '', role: m.role, date: d, today: d === today, me: m.id === me.id,

        }

    list.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var mineYear = String(y);

  /* ---------- 새가족 4주 정착 ---------- */
  var NEWCOMER_FROM = '2026-11-01', NEWCOMER_DAYS = 28, NEWCOMER_GOAL = 4;
  /* 새가족 계산 시작일: '_설정' 시트에 키 newcomerFrom, 값 2027-01-01 처럼 적으면 그 날짜부터 등록한 학생만 새가족이에요 */
  function newcomerFrom(S) {
    var x = S.all('settings').filter(function (r) { return r.key === 'newcomerFrom'; })[0];
    return x && isDate(x.value) ? x.value : NEWCOMER_FROM;
  }
  /* 회원별 주일 출석 날짜 목록 (한 요청 안에서 한 번만 만들어 함께 써요) */
  var sunMemo = { arr: null, len: -1, by: {} };
  function sunByMember(S) {
    var att = S.all('attendance');
    if (sunMemo.arr !== att || sunMemo.len !== att.length) {
      var by = {};
      att.forEach(function (a) { if (svc(a) === 'sun') (by[a.memberId] = by[a.memberId] || []).push(a.date); });
      sunMemo = { arr: att, len: att.length, by: by };
    }
    return sunMemo.by;
  }
  function newcomerInfo(S, m, today) {
    var reg = (m.createdAt || '').slice(0, 10);
    if (m.role !== 'student' || !isDate(reg) || reg < newcomerFrom(S)) return null;
    var days = Math.round((dParse(today) - dParse(reg)) / 86400000);
    var suns = (sunByMember(S)[m.id] || []).filter(function (d) { return d >= reg; }).sort();
    var uniqSuns = suns.filter(function (d, i) { return suns.indexOf(d) === i; });
    var doneDate = uniqSuns.length >= NEWCOMER_GOAL ? uniqSuns[NEWCOMER_GOAL - 1] : '';

    return { reg: reg, days: days, count: Math.min(uniqSuns.length, NEWCOMER_GOAL), goal: NEWCOMER_GOAL, doneDate: doneDate, isNew: days <= NEWCOMER_DAYS };

  /* ---------- 일괄 등록 · 진급 ---------- */
  var GRADE_NEXT = { '중1': '중2', '중2': '중3', '중3': '고1', '고1': '고2', '고2': '고3' };
  function memberBulkSave(S, me, p) {

    var added = 0, skipped = [], problems = [];
    list.forEach(function (r, i) {

      if (!name) return;
      if (birth && !isDate(birth)) { problems.push((i + 1) + '번째 줄 생년월일(' + birth + ')'); birth = ''; }
      if (rows.some(function (x) { return x.name === name && (x.birth || '') === birth && x.active === '1'; })) { skipped.push(name); return; }
      var pin = p.pinRule === 'birth' && birth ? birth.slice(5, 7) + birth.slice(8, 10) : clean(p.pin, 20) || '0000';
      var rec = { id: uid(), name: name, role: 'student', grade: clean(r.grade, 10), cls: clean(r.cls, 20), gender: clean(r.gender, 4), birth: birth,
        phone: fmtPhone(r.phone), parentPhone: fmtPhone(r.parentPhone), memo: '', active: '1', createdAt: S.now(), avatar: '', staff: '', teams: '', mustPin: '1' };
      rec.pinHash = pinHash(S, rec.id, pin);

  function memberPromote(S, me, p) {

  }

  /* ---------- 설교 3줄 요약 ---------- */
  function sermonWindow(date, today) { return isDate(date) && dow(date) === 0 && date <= today && today <= dAdd(date, 6); }

  /* ---------- 달란트 (상·하반기 시즌제 + 특새 2배 이벤트 반영) ---------- */
  var DEFAULT_REWARDS = [{ id: 'meal', title: '교역자와 식사권', cost: '200', desc: '교회 안에서 배달음식으로 교역자와 함께 식사해요. 메뉴와 날짜는 함께 정해요.', active: '1', emoji: '🍕' }];
  function rewardsAll(S) {
    var r = S.all('rewards');

    return r;

  function talentLedger(S) {
    var tdy = S.today();
    var season = currentSeason(tdy);
    var sStart = season.start;
    var dawnCfg = specialDawnConfig(S, tdy);
    var qtCfg = rangeConfig(S, tdy, 'qtX2');

    var acc = {};
    function add(id, date, key, amount, label) {

      if (amount >= 0) a.earned += amount; else a.spent -= amount;
      a.items.push({ date: date, key: key, amount: amount, label: label });
    }
    S.all('qtLogs').forEach(function (l) {
      if (inRange(qtCfg, l.date)) add(l.memberId, l.date, 'qt', POINTS.qt * 2, POINT_LABELS.qt + ' (' + qtCfg.title + (/2배/.test(qtCfg.title) ? '' : ' 2배') + '🔥)');
      else add(l.memberId, l.date, 'qt', POINTS.qt, POINT_LABELS.qt);
    });
    S.all('attendance').forEach(function (a) {
      var k = svc(a);
      var pts = POINTS[k];
      var lbl = POINT_LABELS[k];
      if (k === 'dawn' && isSpecialDawnDate(dawnCfg, a.date)) {
        pts = POINTS.dawn * 2;
        lbl = POINT_LABELS.dawn + ' (' + dawnCfg.title + ' 2배🔥)';
      }
      add(a.memberId, a.date, k, pts, lbl);
    });
    S.all('sermonNotes').forEach(function (n) { add(n.memberId, n.date, 'sermon', POINTS.sermon, POINT_LABELS.sermon); });
    S.all('members').forEach(function (m) {
      if (m.active !== '1') return;
      var reg = (m.createdAt || '').slice(0, 10);
      var regYear = +reg.slice(0, 4);
      if (isDate(m.birth || '') && m.role === 'student' && isDate(reg) && regYear >= 2020) {
        for (var yy = regYear; yy <= +tdy.slice(0, 4); yy++) {
          var bd = bdayIn(yy, m.birth);
          if (bd >= reg && bd <= tdy) add(m.id, bd, 'birthday', POINTS.birthday, POINT_LABELS.birthday);
        }
      }
      var nc = newcomerInfo(S, m, tdy);
      if (nc && nc.doneDate) add(m.id, nc.doneDate, 'newcomer', POINTS.newcomer, POINT_LABELS.newcomer);
    });
    S.all('talentLog').forEach(function (g) { add(g.memberId, g.createdAt.slice(0, 10), 'bonus', Number(g.amount) || 0, (Number(g.amount) >= 0 ? '선생님 보너스' : '선생님 조정') + (g.reason ? ' · ' + g.reason : '')); });
    var rw = {}; rewardsAll(S).forEach(function (r) { rw[r.id] = r; });
    S.all('redemptions').forEach(function (x) {
      if (x.status === 'canceled') return;
      add(x.memberId, x.createdAt.slice(0, 10), 'spend', -(Number(x.cost) || 0), (rw[x.rewardId] ? rw[x.rewardId].title : '보상') + ' 교환');
    });
    Object.keys(acc).forEach(function (k) { acc[k].balance = acc[k].earned - acc[k].spent; });
    return acc;
  }
  function talentBlock(S, me, precomputedLed) {
    var led = precomputedLed || talentLedger(S), today = S.today(), month = today.slice(0, 7);
    var season = currentSeason(today);
    var mine = led[me.id] || { earned: 0, spent: 0, balance: 0, items: [] };
    // 지난 시즌에 신청해 아직 처리 안 된 교환은 계속 보여 줘요 (교역자가 마무리할 수 있게)
    function inSeasonOrOpen(x) { return (x.createdAt || '').slice(0, 10) >= season.start || x.status === 'pending' || x.status === 'approved'; }
    var members = S.all('members'), byId = {}; members.forEach(function (m) { byId[m.id] = m; });
    var rewards = rewardsAll(S);
    var rw = {}; rewards.forEach(function (r) { rw[r.id] = r; });
    var monthRank = members.filter(function (m) { return m.active === '1' && m.role === 'student'; }).map(function (m) {
      var it = (led[m.id] || { items: [] }).items.filter(function (x) { return x.amount > 0 && x.date.slice(0, 7) === month; });
      return { id: m.id, name: nm(S, m.id, m.name), avatar: m.avatar || '', cls: m.cls, month: it.reduce(function (a, x) { return a + x.amount; }, 0) };
    }).sort(function (a, b) { return b.month - a.month; }).filter(function (x) { return x.month > 0; }).slice(0, 10);
    var slots = {}; S.all('mealSlots').forEach(function (sl) { slots[sl.id] = sl; });
    function redView(x) {
      var m = byId[x.memberId], r = rw[x.rewardId];
      return { id: x.id, rewardTitle: r ? r.title : '보상', emoji: r ? r.emoji : '🎁', cost: Number(x.cost) || 0, status: x.status, note: x.note, reply: x.reply,
        schedDate: x.schedDate, handledBy: x.handledBy, createdAt: x.createdAt, memberId: x.memberId, name: m ? nm(S, m.id, m.name) : '', cls: m ? m.cls : '', avatar: m ? m.avatar || '' : '',

      season: season,

      balance: mine.balance, earned: mine.earned, spent: mine.spent,
      monthEarned: mine.items.filter(function (x) { return x.amount > 0 && x.date.slice(0, 7) === month; }).reduce(function (a, x) { return a + x.amount; }, 0),
      history: mine.items.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 40),
      rewards: rewards.filter(function (r) { return r.active === '1' || me.role === 'teacher'; }).map(function (r) { return { id: r.id, title: r.title, cost: Number(r.cost) || 0, desc: r.desc, active: r.active === '1', emoji: r.emoji || '🎁' }; }),
      myRedemptions: S.all('redemptions').filter(function (x) { return x.memberId === me.id && inSeasonOrOpen(x); }).map(redView).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }),
      harvests: harvestCount(S, me.id), // 지금까지 딴 열매 수 (시즌과 상관없이) → 몇 번째 나무인지
      treeGrowth: treeGrowth(S, me.id, mine), // 나무가 자란 만큼: 마지막 열매를 딴 뒤 모은 달란트
      monthRank: monthRank
    };
    if (me.role === 'teacher') {
      res.redemptions = S.all('redemptions').filter(inSeasonOrOpen).map(redView).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
      res.balances = members.filter(function (m) { return m.active === '1' && m.role === 'student'; }).map(function (m) {
        var l = led[m.id] || { earned: 0, spent: 0, balance: 0, items: [] };
        return { id: m.id, name: nm(S, m.id, m.name), cls: m.cls, grade: m.grade, avatar: m.avatar || '', balance: l.balance, earned: l.earned, spent: l.spent };
      }).sort(function (a, b) { return b.balance - a.balance; });
      res.pending = res.redemptions.filter(function (x) { return x.status === 'pending'; }).length;
    }
    return res;
  }
  /* ---------- 교역자와 식사: 교역자가 매달 식사 가능한 칸을 열고, 학생은 그중 하나를 골라 신청해요 ---------- */
  // 하루 최대 2팀(점심·저녁). 한 팀 = 신청자 1명 + 초대 친구 최대 2명. 칸은 그달 1일에 학생에게 공개돼요(교역자는 미리 열어 둘 수 있어요).
  var FRIEND_FEE = 5000, MEAL_TIMES = ['점심', '저녁'], MAX_FRIENDS = 2;
  function dedupe(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
  function mealTimeRank(t) { var i = MEAL_TIMES.indexOf(t); return i < 0 ? 9 : i; }
  function mealFriendFee(S) {
    var x = S.all('settings').filter(function (r) { return r.key === 'mealFriendFee'; })[0];
    var n = x ? parseInt(x.value, 10) : NaN;
    return isNaN(n) ? FRIEND_FEE : n;
  }
  function slotBookings(S) {
    var by = {};
    S.all('redemptions').forEach(function (x) { if (x.slotId && x.status !== 'canceled') by[x.slotId] = x; });
    return by;
  }
  function slotOpenToStudents(sl, today) { return sl.date > today && sl.date.slice(0, 7) <= today.slice(0, 7); }
  function mealSlotsView(S, me) {
    var today = S.today(), book = slotBookings(S), adm = isAdmin(S, me);
    var byId = {}; S.all('members').forEach(function (m) { byId[m.id] = m; });
    return S.all('mealSlots').filter(function (sl) { return adm ? sl.date >= dAdd(today, -30) : slotOpenToStudents(sl, today) || (book[sl.id] && book[sl.id].memberId === me.id); })
      .sort(function (a, b) { return a.date !== b.date ? (a.date < b.date ? -1 : 1) : mealTimeRank(a.time) - mealTimeRank(b.time); })
      .map(function (sl) {
        var b = book[sl.id], o = { id: sl.id, date: sl.date, time: sl.time, place: sl.place, note: sl.note, taken: !!b, mine: !!(b && b.memberId === me.id) };
        if (adm) { o.open = sl.date.slice(0, 7) <= today.slice(0, 7); if (b) { var m = byId[b.memberId]; o.booking = { id: b.id, name: m ? nm(S, m.id, m.name) : '', cls: m ? m.cls : '', friend: b.friend || '', status: b.status }; } }
        return o;
      });
  }
  function mealSlotSave(S, me, p) {
    if (!isAdmin(S, me)) throw userError('식사 날짜는 교역자가 열어요.');
    var rows = S.all('mealSlots'), today = S.today();
    if (p.op === 'add') {
      var d = clean(p.date), ts = [].concat(p.times || p.time || []).map(function (t) { return clean(t, 10); });
      if (!isDate(d)) throw userError('날짜를 골라 주세요.');
      if (d <= today) throw userError('내일 이후 날짜만 열 수 있어요.');
      if (!ts.length) throw userError('점심이나 저녁을 골라 주세요.');
      if (ts.some(function (t) { return MEAL_TIMES.indexOf(t) < 0; })) throw userError('점심이나 저녁만 열 수 있어요.');
      var dayRows = rows.filter(function (x) { return x.date === d; });
      ts = dedupe(ts).filter(function (t) { return !dayRows.some(function (x) { return x.time === t; }); });
      if (!ts.length) throw userError('이미 열린 칸이에요.');
      if (dayRows.length + ts.length > MEAL_TIMES.length) throw userError('하루에 2팀(점심·저녁)까지만 열 수 있어요.');
      ts.forEach(function (t) { rows.push({ id: uid(), date: d, time: t, place: clean(p.place, 30), note: clean(p.note, 60), createdBy: me.name, createdAt: S.now() }); });
      S.save('mealSlots', rows);
    } else if (p.op === 'del') {
      if (slotBookings(S)[clean(p.id)]) throw userError('예약된 칸이에요. 먼저 그 교환을 취소해 주세요.');
      S.save('mealSlots', rows.filter(function (x) { return x.id !== clean(p.id); }));
    } else if (p.op === 'fee') {
      var n = parseInt(String(p.fee == null ? '' : p.fee).replace(/[^0-9]/g, ''), 10);
      if (isNaN(n) || n > 100000) throw userError('금액을 확인해 주세요.');
      var st = S.all('settings').filter(function (x) { return x.key !== 'mealFriendFee'; });
      st.push({ key: 'mealFriendFee', value: String(n), updatedAt: S.now() });
      S.save('settings', st);
    } else throw userError('알 수 없는 요청이에요.');
  }

  /* ---------- 열매 나무: 달란트로 자라고, 교환하면 다음 나무 씨앗을 심어요 ---------- */
  var TREES = ['apple', 'orange', 'peach', 'cherry', 'lemon', 'blueberry'];
  // 열매 = 가장 비싼 교환(식사권). 음료처럼 작은 교환은 나무만 작아지고 품종은 그대로예요
  function fruitCost(S) {
    var c = rewardsAll(S).filter(function (r) { return r.active === '1'; }).map(function (r) { return Number(r.cost) || 0; });
    return c.length ? Math.max.apply(null, c) : 200;
  }
  function harvestCount(S, memberId) {
    var fc = fruitCost(S);
    return S.all('redemptions').filter(function (x) { return x.memberId === memberId && x.status !== 'canceled' && (Number(x.cost) || 0) >= fc; }).length;
  }
  function treeGrowth(S, memberId, mine) {
    var fc = fruitCost(S), last = null, sStart = currentSeason(S.today()).start;
    S.all('redemptions').forEach(function (x) {
      if (x.memberId === memberId && x.status !== 'canceled' && (Number(x.cost) || 0) >= fc && (!last || x.createdAt >= last.createdAt)) last = x; // 같은 분에 연달아 바꿔도 마지막 기록을 읽어요
    });
    var bal = Math.max(0, mine.balance);
    // 이번 시즌에 열매를 땄으면: 그때 남은 달란트는 빼고, 그 뒤에 모은 만큼만 자라요 (열매를 딴 순간 다시 씨앗)
    if (!last || last.createdAt.slice(0, 10) < sStart) return bal;
    return Math.max(0, bal - (Number(last.treeLeft) || 0));
  }
  function treeOf(S, memberId) { return TREES[harvestCount(S, memberId) % TREES.length]; }
  // 다른 친구 화면의 작은 캐릭터도 지금 키우는 나무로 보이게 저장해 둬요
  function syncTree(S, memberId) {
    var rows = S.all('members'), m = rows.filter(function (x) { return x.id === memberId; })[0];
    if (!m || m.role !== 'student' || !m.avatar) return;
    var a; try { a = JSON.parse(m.avatar) || {}; } catch (e) { return; }
    var k = treeOf(S, memberId);
    if (a.kind === k) return;
    a.kind = k; delete a.color; m.avatar = JSON.stringify(a);
    S.save('members', rows);
  }
  function redeem(S, me, p) {
    if (me.role !== 'student') throw userError('학생 계정에서 교환할 수 있어요.');
    var r = rewardsAll(S).filter(function (x) { return x.id === p.rewardId && x.active === '1'; })[0];
    if (!r) throw userError('지금은 교환할 수 없는 보상이에요.');
    var cost = Number(r.cost) || 0;
    var bal = (talentLedger(S)[me.id] || { balance: 0 }).balance;
    if (bal < cost) throw userError('달란트가 ' + (cost - bal) + ' 부족해요. 조금만 더 모아요!');
    var rows = S.all('redemptions');
    if (rows.some(function (x) { return x.memberId === me.id && x.rewardId === r.id && x.status === 'pending'; })) throw userError('이미 신청한 교환이 있어요. 선생님이 확인할 때까지 기다려 주세요.');
    var slotId = '', friend = '', fee = '';
    if (cost >= fruitCost(S)) { // 교역자와 식사: 열린 칸 중 하나를 골라야 해요
      var today = S.today(), sl = S.all('mealSlots').filter(function (x) { return x.id === clean(p.slotId); })[0];
      if (!sl) throw userError(S.all('mealSlots').some(function (x) { return slotOpenToStudents(x, today); }) ? '식사 날짜를 골라 주세요.' : '이번 달 식사 날짜가 아직 열리지 않았어요. 교역자가 매달 1일에 열어요.');
      if (!slotOpenToStudents(sl, today)) throw userError('지금은 고를 수 없는 날짜예요.');
      if (slotBookings(S)[sl.id]) throw userError('방금 다른 친구가 먼저 예약했어요. 다른 날을 골라 주세요.');
      var fs = dedupe([].concat(p.friends || p.friend || []).map(function (x) { return clean(x, 20); }));
      if (fs.length > MAX_FRIENDS) throw userError('친구는 ' + MAX_FRIENDS + '명까지 초대할 수 있어요.');

      slotId: slotId, friend: friend, friendFee: fee, friendPaid: '' });

  }
  function redeemCancel(S, me, p) {

  function redeemUpdate(S, me, p) {

  function contentSave(S, me, p) {
    var def = CONTENT[p.table];

    if (me.role !== 'teacher' && !(isOfficer(me) && p.table === 'notices')) throw userError('선생님만 할 수 있어요.');

    var rec = item.id ? rows.filter(function (x) { return x.id === item.id; })[0] : null;
    if (item.id && !rec) throw userError('이미 삭제된 글이에요.');
    var isNew = !rec;
    if (!isNew && !canEditContent(S, me, rec)) throw userError('내가 올린 글만 고칠 수 있어요. 교역자께 부탁해 주세요.');
    rec = rec || { id: uid(), authorId: me.id };
    def.fields.forEach(function (f) {
      if (f === 'photo') return; // 공지 사진은 아래에서 따로 저장해요
      if (f === 'important' && me.role !== 'teacher') rec[f] = rec[f] || ''; // 맨 위 고정은 선생님만
      else if (f === 'important' || f === 'signup' || f === 'camp') rec[f] = flag(item[f]);
      else if (f === 'fee' || f === 'capacity') { var n = parseInt(String(item[f] || '').replace(/[^0-9]/g, ''), 10); rec[f] = n > 0 ? String(Math.min(n, f === 'fee' ? 10000000 : 9999)) : ''; }
      else rec[f] = clean(item[f], f === 'content' ? 4000 : 200);
    });
    Object.keys(def.required).forEach(function (f) {
      if (!rec[f]) throw userError(def.required[f] + '을(를) 입력해 주세요.');
    });
    ['date', 'endDate', 'deadline'].forEach(function (f) {
      if (rec[f] && !isDate(rec[f])) throw userError('날짜 형식을 확인해 주세요.');
    });
    if (p.table === 'events' && rec.endDate && rec.endDate < rec.date) throw userError('종료일이 시작일보다 빨라요.');
    if (p.table === 'notices') {
      if (isNew) { rec.author = me.name; rec.createdAt = S.now(); }

  /* =====================================================================

   * 일정표 · 조 편성 · 방 배정 · 조별 실시간 점수판
   * 시작 7일 전부터 끝난 다음 날까지 '수련회' 탭이 열려요. (교역자·올린 선생님은 행사 카드에서 언제든 미리보기)
   * ===================================================================== */
  function campData() { return state.campPreview || (state.data && state.data.camp) || null; }
  function setCamp(v) {
    if (state.campPreview && v && v.event && state.campPreview.event.id === v.event.id) state.campPreview = v;
    else if (state.data) state.data.camp = v;
  }
  function campDays(c) {
    var out = [], d = c.event.date, end = c.event.endDate || c.event.date, n = 0;
    while (d <= end && n < 10) { out.push(d); d = addDays(d, 1); n++; }
    return out;
  }
  function campPhaseBadge(c) {
    if (c.phase === 'before') return '<span class="badge b-pri">' + dday(c.event.date) + '</span>';
    if (c.phase === 'during') return '<span class="badge b-new">진행 중 · ' + (campDays(c).indexOf(today()) + 1) + '일차</span>';
    return '<span class="badge b-gray">끝났어요</span>';
  }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function campNowItem(c) {
    if (c.phase !== 'during') return null;
    var t = today(), hm = nowHM();
    var list = c.schedule.filter(function (x) { return x.day === t && x.time; });
    var cur = null, next = null;
    list.forEach(function (x, i) {
      var end = x.endTime || (list[i + 1] ? list[i + 1].time : '24:00');
      if (x.time <= hm && hm < end) cur = x;
      if (!next && x.time > hm) next = x;
    });
    return { cur: cur, next: next };
  }
  function groupOf(c, kind, id) { return c.groups.filter(function (g) { return g.id === id && g.kind === kind; })[0] || null; }
  function campHomeCard() {
    var c = state.data.camp;
    if (!c) {
      // 교사: 아직 열리지 않은 수련회도 미리 편성·관리할 수 있게 목록을 보여 줘요
      var sw = campSwitcher();
      return sw ? '<div class="card camp-mini" style="display:block"><b>준비 중인 수련회</b><span class="sub">눌러서 미리 조 편성 · 방 배정 · 일정표를 준비해요</span><div style="margin-top:10px">' + sw + '</div></div>' : '';

    else line = my.length ? my.join(' · ') : '조 편성 · 방 배정 · 일정표를 확인해요';
    return '<button class="card camp-mini" data-act="campOpen" data-id="' + esc(c.event.id) + '"><span class="cm-ic"></span><span class="grow"><b>' + esc(c.event.title) + ' 올인원 가이드 열기 ' + campPhaseBadge(c) + '</b>' +

  }
  /* 교사용: data.campEvents 에서 다른 수련회를 골라 campGet 으로 열어요 */
  function campSwitcher() {

    var h = '';
    if (state.campPreview) h += '<div class="card tight camp-preview"><span class="grow"><b>미리보기</b> · 학생에게는 시작 7일 전부터 보여요</span><button class="link" data-act="campPreviewClose">닫기</button></div>';

    h += '<div class="card camp-hero"><div class="row between"><span class="kicker">수련회 모드</span>' + campPhaseBadge(c) + '</div>' +
      '<h2>' + esc(e.title) + '</h2><div class="sub">' + fmtD(e.date, true) + (e.endDate ? ' ~ ' + fmtD(e.endDate, true) : '') + (e.place ? ' · ' + esc(e.place) : '') + (e.time ? ' · ' + esc(e.time) : '') + '</div>' +
      (my.length ? '<div class="camp-mys">' + my.join('') + '</div>' : '') + '</div>';
    var ni = campNowItem(c);
    if (ni && (ni.cur || ni.next)) {
      h += '<div class="card camp-now">' + (ni.cur ? '<div><span class="badge b-new">지금</span> <b>' + esc(ni.cur.title) + '</b>' + (ni.cur.place ? ' <span class="sub">@' + esc(ni.cur.place) + '</span>' : '') + '</div>' : '') +
        (ni.next ? '<div class="sub" style="margin-top:4px">다음 ' + esc(ni.next.time) + ' · ' + esc(ni.next.title) + (ni.next.place ? ' @' + esc(ni.next.place) : '') + '</div>' : '') + '</div>';
    }
    var nT = c.groups.filter(function (x) { return x.kind === 'team'; }).length, nR = c.groups.filter(function (x) { return x.kind === 'room'; }).length;
    h += '<div class="seg camp-seg">' + [['time', '일정'], ['team', '조' + (nT ? ' ' + nT : '')], ['room', '방' + (nR ? ' ' + nR : '')], ['score', '점수']].map(function (x) {
      return '<button data-act="campSub" data-v="' + x[0] + '" class="' + (sub === x[0] ? 'on' : '') + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    if (sub === 'time') h += campTimeView(c);
    else if (sub === 'team' || sub === 'room') h += campGroupView(c, sub);

  }

  /* 일정표 */
  function campTimeView(c) {
    var days = campDays(c);
    var day = state.campDay && days.indexOf(state.campDay) >= 0 ? state.campDay : (days.indexOf(today()) >= 0 ? today() : days[0]);
    var h = '<div class="chips">' + days.map(function (d, i) {
      return '<button class="chip ' + (d === day ? 'on' : '') + '" data-act="campDay" data-v="' + d + '">' + (i + 1) + '일차 · ' + fmtD(d, true) + '</button>';
    }).join('') + '</div>';
    var list = c.schedule.filter(function (x) { return x.day === day; });
    var ni = day === today() ? campNowItem(c) : null;
    if (!list.length) h += '<div class="card empty">' + face('sky', 'wow') + '아직 이날 일정이 없어요' + (c.canEdit ? '<br><button class="btn sm" style="margin-top:10px" data-act="campSchedEdit">일정표 만들기</button>' : '') + '</div>';
    else {
      h += '<div class="card camp-tt">' + list.map(function (x) {
        var on = ni && ni.cur && ni.cur.id === x.id, past = day < today() || (day === today() && ni && x.time && (x.endTime || '') && x.endTime <= nowHM());
        return '<div class="tt-row' + (on ? ' on' : '') + (past && !on ? ' past' : '') + '"><div class="tt-time"><b>' + esc(x.time || '—') + '</b>' + (x.endTime ? '<small>~' + esc(x.endTime) + '</small>' : '') + '</div>' +
          '<div class="tt-body"><b>' + esc(x.title) + '</b>' + (on ? ' <span class="badge b-new">지금</span>' : '') + (x.place ? '<div class="sub">' + esc(x.place) + '</div>' : '') + (x.note ? '<div class="sub">' + esc(x.note) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>';
    }
    if (c.canEdit && c.schedule.length) h += '<button class="btn line block" data-act="campSchedEdit">일정표 고치기</button>';
    return h;
  }
  function schedToText(c) {
    var days = campDays(c), out = [];
    days.forEach(function (d, i) {
      var list = c.schedule.filter(function (x) { return x.day === d; });
      out.push('[' + (i + 1) + '일차 ' + fmtShort(d) + ']');
      list.forEach(function (x) { out.push((x.time || '') + (x.endTime ? '-' + x.endTime : '') + ' ' + x.title + (x.place ? ' @' + x.place : '') + (x.note ? ' // ' + x.note : '')); });
      out.push('');
    });
    return out.join('\n').trim();
  }
  function parseSched(text, c) {
    var days = campDays(c), day = days[0], items = [], errs = [];
    var y0 = +c.event.date.slice(0, 4), m0 = +c.event.date.slice(5, 7);
    String(text || '').split(/\r?\n/).forEach(function (raw, li) {
      var line = raw.trim();
      if (!line) return;
      var hd = /^\[?\s*(?:(\d+)\s*일차)?\s*(?:(\d{1,2})[\/.\-](\d{1,2}))?[^\]]*\]?$/.exec(line);
      if (hd && (hd[1] || hd[2]) && !/^\d{1,2}:\d{2}/.test(line)) {
        if (hd[2]) { var mo = +hd[2], yy = mo < m0 - 6 ? y0 + 1 : y0; day = yy + '-' + pad(mo) + '-' + pad(+hd[3]); }
        else day = addDays(c.event.date, +hd[1] - 1);
        return;
      }
      var m = /^(\d{1,2}):(\d{2})(?:\s*[-~]\s*(\d{1,2}):(\d{2}))?\s+(.+)$/.exec(line);
      var time = '', end = '', rest = line;
      if (m) { time = pad(+m[1]) + ':' + m[2]; end = m[3] ? pad(+m[3]) + ':' + m[4] : ''; rest = m[5]; }
      var note = ''; var ni = rest.indexOf('//'); if (ni >= 0) { note = rest.slice(ni + 2).trim(); rest = rest.slice(0, ni).trim(); }
      var place = ''; var pi = rest.lastIndexOf('@'); if (pi > 0) { place = rest.slice(pi + 1).trim(); rest = rest.slice(0, pi).trim(); }
      if (!rest) { errs.push((li + 1) + '번째 줄'); return; }
      items.push({ day: day, time: time, endTime: end, title: rest, place: place, note: note });
    });
    return { items: items, errs: errs };
  }

  /* 조 편성 · 방 배정 */
  function memberChip(m, c, kind, me) {
    var mine = m.id === state.data.me.id;
    var inner = Buddy.parse(m.avatar).set ? Buddy.mini(m.avatar, 22) : '<span class="ci">' + esc(initials(m.name)) + '</span>';
    return (c.canEdit ? '<button class="mchip' + (mine ? ' me' : '') + '" data-act="campPick" data-kind="' + kind + '" data-id="' + m.id + '">' : '<span class="mchip' + (mine ? ' me' : '') + '">') +
      inner + '<span>' + esc(m.name) + (m.grade ? '<small>' + esc(m.grade) + '</small>' : '') + '</span>' + (c.canEdit ? '</button>' : '</span>');
  }
  function campGroupView(c, kind) {
    var gs = c.groups.filter(function (g) { return g.kind === kind; });
    var label = kind === 'team' ? '조' : '방';
    var mine = kind === 'team' ? c.myTeam : c.myRoom;
    var h = '';
    if (c.canEdit) {
      h += '<div class="row" style="gap:8px;margin-bottom:10px"><button class="btn sm" data-act="campAuto" data-kind="' + kind + '">자동 ' + (kind === 'team' ? '조 편성' : '방 배정') + '</button>' +
        '<button class="btn line sm" data-act="campGroupNew" data-kind="' + kind + '">+ ' + label + ' 추가</button></div>';
    }
    if (!gs.length) return h + '<div class="card empty">' + face('yellow', 'wow') + '아직 ' + (kind === 'team' ? '조 편성' : '방 배정') + '이 없어요' + (c.canEdit ? '<br><span class="sub">신청한 학생으로 자동 편성해 보세요</span>' : '') + '</div>';
    h += '<input class="in camp-q" id="campQ" placeholder="이름으로 찾기" autocomplete="off">';
    var order = gs.slice().sort(function (a, b) { return (a.id === mine ? -1 : 0) - (b.id === mine ? -1 : 0); });
    h += order.map(function (g) {
      return '<div class="card camp-g' + (g.id === mine ? ' mine' : '') + '" style="--gc:' + esc(g.color) + '" data-names="' + esc(g.members.map(function (m) { return m.name; }).join(' ')) + '">' +
        '<div class="row between"><div class="grow"><b class="g-name">' + esc(g.name) + '</b>' + (g.id === mine ? ' <span class="badge b-new">내 ' + label + '</span>' : '') +
        '<span class="sub"> · ' + g.members.length + '명' + (g.leader ? ' · ' + (kind === 'team' ? '조장 ' : '담당 ') + esc(g.leader) : '') + '</span>' + (g.note ? '<div class="sub">' + esc(g.note) + '</div>' : '') + '</div>' +
        (c.canEdit ? '<button class="link" data-act="campGroupEdit" data-id="' + g.id + '">수정</button>' :
          (kind === 'team' && g.id === mine && !isT() ? '<button class="link" data-act="campTeamEdit" data-id="' + g.id + '">조명·구호</button>' : '')) + '</div>' +
        '<div class="mchips">' + (g.members.length ? g.members.map(function (m) { return memberChip(m, c, kind); }).join('') : '<span class="sub">아직 아무도 없어요</span>') + '</div></div>';
    }).join('');
    if (c.canEdit && c.people) {
      var placed = {}; gs.forEach(function (g) { g.members.forEach(function (m) { placed[m.id] = true; }); });
      var rest = c.people.filter(function (m) { return !placed[m.id]; });
      h += '<div class="card camp-g rest"><b>배정 안 된 학생 ' + rest.length + '명</b><span class="sub"> · 이름을 눌러 ' + label + '을 정해요</span>' +
        '<div class="mchips">' + (rest.length ? rest.map(function (m) { return memberChip(m, c, kind); }).join('') : '<span class="sub">모두 배정됐어요 </span>') + '</div></div>';
      h += '<p class="hint">' + (c.event && state.data.events.some(function (e) { return e.id === c.event.id && e.signup === '1'; }) ? '참가 신청한 학생' : '재적 학생 전체') + '을 기준으로 편성해요. 학생 이름을 누르면 다른 ' + label + '으로 옮길 수 있어요.</p>';
    }
    return h;
  }

  /* 점수판 */
  var CAMP_REASONS = ['레크리에이션', '퀴즈', '찬양', '시간 지킴', '청소', '조 모임'];
  function campRanked(c) {
    return c.groups.filter(function (g) { return g.kind === 'team'; }).slice().sort(function (a, b) { return b.score - a.score || (a.name < b.name ? -1 : 1); });
  }
  function scoreBars(c, big) {
    var list = campRanked(c);
    if (!list.length) return '<div class="card empty">' + face('sky', 'wow') + '조 편성을 먼저 해 주세요</div>';
    var max = Math.max(1, list[0].score), rank = 0, prev = null;
    return '<div class="' + (big ? 'board-big' : 'card board') + '">' + list.map(function (g, i) {
      if (g.score !== prev) { rank = i + 1; prev = g.score; }
      var medal = rank + '위';
      var w = Math.max(4, Math.round(Math.max(0, g.score) / max * 100));
      var tag = c.canScore && !big ? 'button' : 'div';
      return '<' + tag + ' class="bd-row' + (g.id === c.myTeam ? ' mine' : '') + '"' + (tag === 'button' ? ' data-act="campScoreSheet" data-id="' + g.id + '"' : '') + ' style="--gc:' + esc(g.color) + '">' +
        '<span class="bd-rank">' + medal + '</span><span class="bd-name">' + esc(g.name) + '</span>' +
        '<span class="bd-bar"><i style="width:' + w + '%"></i></span><b class="bd-score">' + g.score.toLocaleString('ko-KR') + '</b></' + tag + '>';
    }).join('') + '</div>';
  }
  function campScoreView(c) {
    var h = '<div class="row between" style="margin:2px 2px 8px"><span class="sub live-dot">● 실시간' + (state.campLiveAt ? ' · ' + esc(state.campLiveAt.slice(11)) + ' 업데이트' : '') + '</span>' +
      '<span class="row" style="gap:12px"><button class="link" data-act="campRefresh">새로고침</button><button class="link" data-act="campBoardBig">크게 보기</button></span></div>';
    h += scoreBars(c);
    if (c.canScore && campRanked(c).length) h += '<p class="hint" style="margin-top:-4px">조를 누르면 점수를 줄 수 있어요. 모든 선생님 화면에 바로 반영돼요.</p>';
    if (c.log && c.log.length) {
      h += '<h3 class="sec"><span>최근 점수</span></h3><div class="list">' + c.log.map(function (x) {
        var canUndo = c.canScore && ((x.byId ? x.byId === state.data.me.id : x.by === state.data.me.name) || c.canEdit);
        return '<div class="li"><span class="dotc" style="background:' + esc(x.color) + '"></span><span class="grow"><span class="t">' + esc(x.group) + ' <b class="' + (x.delta < 0 ? 'neg' : 'pos') + '">' + (x.delta > 0 ? '+' : '') + x.delta + '</b></span>' +
          '<div class="sub">' + esc([x.reason, x.by, x.createdAt.slice(5).replace('-', '/')].filter(Boolean).join(' · ')) + '</div></span>' +
          (canUndo ? '<button class="icon-btn" data-act="campScoreUndo" data-id="' + x.id + '" aria-label="이 점수 지우기">✕</button>' : '') + '</div>';
      }).join('') + '</div>';
    }

  }

  /* 실시간 점수 새로고침 (점수판을 볼 때만 15초마다) */
  var campTimer = null, campTimerMs = 0;
  function campPollSync() {
    var c = campData();
    var want = !!c && state.token && ((state.tab === 'camp' && state.campSub === 'score') || state.campBig);
    // 선생님 화면과 크게 보기는 15초, 학생 화면은 45초마다 (서버 실행 수를 줄여요)
    var ms = want ? (isT() || state.campBig ? 15000 : 45000) : 0;
    if (campTimer && campTimerMs !== ms) { clearInterval(campTimer); campTimer = null; }
    if (ms && !campTimer) { campTimer = setInterval(campPollTick, ms); campTimerMs = ms; }
  }
  function applyLive(r) {
    var c = campData(); if (!c || !r) return;
    c.groups.forEach(function (g) { if (g.kind === 'team') g.score = r.totals[g.id] || 0; });
    c.log = r.log; state.campLiveAt = r.at;
  }
  function campPollTick() {
    var c = campData();
    if (!c || document.hidden) return;
    api('campLive', { eventId: c.event.id }).then(function (r) {
      if (!r || !r.ok) return;
      applyLive(r.data);
      if (state.campBig) drawBig();
      else if (state.tab === 'camp' && !document.querySelector('#layer .sheet')) render();
    }, function () { });
  }
  function drawBig() {
    var c = campData(); if (!c) return;
    var el = document.getElementById('campBig');
    var html = '<div class="big-head"><b>' + esc(c.event.title) + ' 점수판</b><span>' + (state.campLiveAt ? esc(state.campLiveAt.slice(11)) + ' 업데이트' : '실시간') + '</span><button data-act="campBoardClose" aria-label="닫기">✕</button></div>' + scoreBars(c, true);
    if (el) el.innerHTML = html;
    else { el = document.createElement('div'); el.id = 'campBig'; el.innerHTML = html; document.body.appendChild(el); }
  }
  function campCall(action, payload, msg) {
    return call(action, payload).then(function (v) {
      if (v && v.event) setCamp(v); else applyLive(v);
      if (msg) toast(msg);
      render();
      return v;
    });
  }

  /* ---------- 수련회 일정표 편집: 카드로 한 줄씩 · 기본 일정 · 하루 복사 · 지난 수련회 가져오기 ----------
   * 바뀔 때마다 바로 저장해요 (campScheduleSave 에 그날까지의 전체 목록을 보내요). 예전 글상자 방식은 "글로 한 번에 고치기"로 남겨 뒀어요. */
  var CS_MINS = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
  var CS_TITLES = ['기상', '아침식사', '점심식사', '저녁식사', '오전 집회', '저녁 집회', '개회예배', '폐회예배', '레크리에이션', '조별 모임', '자유시간', '간식', '기도회', '취침'];
  var CS_PLACES = ['대강당', '식당', '숙소', '운동장', '교회 앞'];
  var CS_DUR = [[0, '없음'], [30, '30분'], [60, '1시간'], [90, '1시간 30분'], [120, '2시간']];
  function hmToMin(hm) { var m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : -1; }
  function minToHm(n) { n = Math.max(0, Math.min(23 * 60 + 55, n)); return pad(Math.floor(n / 60)) + ':' + pad(n % 60); }
  function hmToK(hm) { var n = Math.max(0, hmToMin(hm)), hh = Math.floor(n / 60), mm = Math.min(55, Math.round(n % 60 / 5) * 5); return { ap: hh < 12 ? '오전' : '오후', h: hh % 12 || 12, m: mm }; }
  function kToHm(k) { var hh = k.h % 12 + (k.ap === '오후' ? 12 : 0); return pad(hh) + ':' + pad(k.m); }
  function csList(c) { return c.schedule.map(function (x) { return { id: x.id, day: x.day, time: x.time || '', endTime: x.endTime || '', title: x.title, place: x.place || '', note: x.note || '' }; }); }
  function csSort(a, b) { return a.day !== b.day ? (a.day < b.day ? -1 : 1) : (a.time || '99') < (b.time || '99') ? -1 : (a.time || '99') > (b.time || '99') ? 1 : 0; }
  function csSave(items, msg, day) {
    var c = campData();
    return campCall('campScheduleSave', { eventId: c.event.id, items: items.slice().sort(csSort).map(function (x) { return { day: x.day, time: x.time, endTime: x.endTime, title: x.title, place: x.place, note: x.note }; }) }, msg)
      .then(function () { if (day) state.csDay = day; setTimeout(campSchedEditor, 0); });
  }
  function csDayOf(c) {
    var days = campDays(c);
    return state.csDay && days.indexOf(state.csDay) >= 0 ? state.csDay : (state.campDay && days.indexOf(state.campDay) >= 0 ? state.campDay : days[0]);
  }
  function campSchedEditor() {
    var c = campData(); if (!c) return;
    var days = campDays(c), day = csDayOf(c), di = days.indexOf(day);
    var list = csList(c).filter(function (x) { return x.day === day; }).sort(csSort);
    var h = '<div class="row between"><h3 style="margin:0">일정표 편집</h3><button class="icon-btn" data-act="closeLayer" aria-label="닫기">✕</button></div>' +
      '<p class="hint" style="margin:4px 0 10px">순서를 누르면 고칠 수 있어요. 바꾼 내용은 바로 저장돼요.</p>';
    if (!c.schedule.length) h += '<div class="cs-start"><b>처음이라면 기본 일정으로 시작해 보세요</b><div class="sub">기상·식사·집회·조별 모임·취침이 미리 채워져요. 시간만 고치면 돼요.</div>' +
      '<button class="btn block" style="margin-top:10px" data-act="csTpl">' + (days.length > 1 ? (days.length - 1) + '박 ' + days.length + '일' : '당일') + ' 기본 일정 불러오기</button></div>';
    h += '<div class="chips">' + days.map(function (d, i) {
      var n = c.schedule.filter(function (x) { return x.day === d; }).length;
      return '<button class="chip ' + (d === day ? 'on' : '') + '" data-act="csDay" data-v="' + d + '">' + (i + 1) + '일차 · ' + fmtShort(d) + (n ? ' (' + n + ')' : '') + '</button>';
    }).join('') + '</div>';
    h += list.length ? '<div class="cs-list">' + list.map(function (x) {
      return '<button type="button" class="cs-item" data-act="csEdit" data-id="' + esc(x.id) + '"><span class="cs-t"><b>' + esc(x.time || '—') + '</b>' + (x.endTime ? '<small>~' + esc(x.endTime) + '</small>' : '') + '</span>' +
        '<span class="cs-b"><b>' + esc(x.title) + '</b>' + (x.place ? '<small>' + esc(x.place) + '</small>' : '') + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</span><span class="cs-go">›</span></button>';
    }).join('') + '</div>' : '<div class="card empty" style="margin-bottom:10px">' + face('sky', 'wow') + (di + 1) + '일차 순서가 아직 없어요</div>';
    h += '<button class="btn block" data-act="csAdd">＋ ' + (di + 1) + '일차 순서 추가</button>' +
      '<div class="grid2" style="margin-top:8px">' +
      (days.length > 1 ? '<button class="btn line sm" data-act="csCopy"' + (list.length ? '' : ' disabled') + '>이 날 일정 복사</button>' : '') +
      '<button class="btn line sm" data-act="csPast">지난 수련회에서</button>' +
      (c.schedule.length ? '<button class="btn line sm" data-act="csTpl">기본 일정으로 바꾸기</button>' : '') +
      '<button class="btn line sm" data-act="campSchedText">글로 한 번에 고치기</button></div>';

  // 사진 파일(<input type="file">)을 받아 가로·세로 1024px 이하 JPEG(품질 0.72) DataURL과 촬영 시각(YYYY-MM-DD HH:mm)을 돌려줘요
  // 서버 제한(1.5MB) 안에 넉넉히 들어가요 (보통 100~300KB)
  function compressProofImage(file, max) {
    return new Promise(function (resolve, reject) {
      // 일부 안드로이드는 HEIC 사진의 type을 비워서 줘요: 비어 있으면 일단 열어 봐요
      if (!file || (file.type && file.type.indexOf('image/') !== 0)) return reject(new Error('이미지 파일만 올릴 수 있어요.'));
      var MAX = max || 1024;
      var d = new Date(file.lastModified || Date.now());
      var shotAt = ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      // FileReader 대신 objectURL: 큰 원본(10MB+)을 문자열로 한 번 더 복사하지 않아 휴대폰 메모리를 아껴요
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * (MAX / w)); w = MAX; }
          else { w = Math.round(w * (MAX / h)); h = MAX; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // 투명 PNG가 검게 나오지 않게
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve({ photo: canvas.toDataURL('image/jpeg', 0.72), shotAt: shotAt });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        var heic = /hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || '');
        reject(new Error(heic ? 'HEIC 사진은 이 휴대폰에서 열 수 없어요. "눌러서 사진 찍기"로 카메라로 바로 찍어 주세요.' : '사진을 불러오지 못했어요. 카메라로 바로 찍어 주세요.'));
      };
      img.src = url;
    });
  }

  function attStats() {
    if (ensureHistory() || state.histLoading) return '<div class="card empty">' + face('sky', 'wow') + '지난 출석 기록을 불러오는 중이에요…</div>';
    var n = state.statRange;
    var h = '<div class="chips">' + [[4, '최근 4번'], [12, '최근 12번'], [0, '전체']].map(function (r) {
      return '<button class="chip ' + (n === r[0] ? 'on' : '') + '" data-act="statRange" data-v="' + r[0] + '">' + r[1] + '</button>';
    }).join('') + '</div>';
    var dates = rangeDates(n);
    if (!dates.length) return h + '<div class="card empty">' + face('yellow', 'wow') + '아직 출석 기록이 없어요.<br>출석체크를 하면 여기에 통계가 쌓여요.</div>';
    var sums = dateSummary(dates);

    var studs = activeStudents();
    var rows = studs.map(function (m) { return { m: m, r: memberRate(m, dates) }; });

    h += '<div class="grid3" style="margin-bottom:12px">' + stat('평균 출석', (tp / sums.length).toFixed(1).replace(/\.0$/, '') + '<small>명</small>') +
      stat('평균 출석률', te ? pct(tp / te) : '-') + stat('2주 이상 결석', longAbs + '<small>명</small>') + '</div>';

    h += '<div class="card"><div class="row between"><b>주별 출석 인원</b><span class="sub">' + (sums.length > 16 ? '최근 16번' : sums.length + '번') + '</span></div>' + barChart(chartSums) + '</div>';

    var groups = groupBy(studs, function (m) { return m.cls || '반 미정'; });
    var gk = Object.keys(groups).sort();
    if (gk.length > 1) {
      h += '<div class="card"><b>반별 출석률</b>' + gk.map(function (g) {

        return '<div class="hbar"><span class="n">' + esc(g) + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.round(p * 100) + '%"></span></span><span class="p">' + (e ? pct(p) : '-') + '</span></div>';
      }).join('') + '</div>';

    rows.sort(state.statSort === 'name' ? function (a, b) { return a.m.name.localeCompare(b.m.name, 'ko'); } :

      '<select class="in" style="width:auto;min-height:34px;padding:4px 8px;font-size:13px" data-change="statSort">' +
      '<option value="rate"' + (state.statSort === 'rate' ? ' selected' : '') + '>출석률 낮은 순</option>' +

      '<table class="tbl"><thead><tr><th>이름</th><th>반</th><th class="r">출석</th><th class="r">출석률</th></tr></thead><tbody>' +
      rows.map(function (x) {
        return '<tr data-act="member" data-id="' + x.m.id + '" style="cursor:pointer"><td><b>' + esc(x.m.name) + '</b>' + (x.r.streak >= 2 ? ' <span class="badge b-warn">' + x.r.streak + '주 결석</span>' : '') + '</td>' +
          '<td class="muted">' + esc(x.m.cls || x.m.grade || '') + '</td><td class="r">' + x.r.c + '/' + x.r.n + '</td><td class="r">' + rateBadge(x.r.p) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return h;
  }

  function barPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function barChart(sums) {
    var W = 340, H = 170, top = 18, bottom = 24, left = 26;
    var max = Math.max.apply(null, sums.map(function (s) { return Math.max(s.present, 1); }));
    var nice = max <= 5 ? 5 : Math.ceil(max / 5) * 5;
    var ph = H - top - bottom, band = (W - left) / sums.length, bw = Math.min(26, band * .62);
    var maxI = 0; sums.forEach(function (s, i) { if (s.present >= sums[maxI].present) maxI = i; });
    var out = '<div class="chart" id="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="주별 출석 인원 막대 그래프">';
    [0, nice / 2, nice].forEach(function (g) {
      var y = top + ph - ph * g / nice;
      out += '<line class="grid" x1="' + left + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/><text class="axis" x="' + (left - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + g + '</text>';
    });
    var every = sums.length > 8 ? Math.ceil(sums.length / 8) : 1;
    sums.forEach(function (s, i) {
      var cx = left + band * i + band / 2, h = ph * s.present / nice, y = top + ph - h;
      out += '<path class="bar" d="' + barPath(cx - bw / 2, y, bw, h, 4) + '"/>';
      if (i === sums.length - 1 || i === maxI) out += '<text class="val" x="' + cx + '" y="' + (y - 5) + '" text-anchor="middle">' + s.present + '</text>';
      if ((sums.length - 1 - i) % every === 0) out += '<text class="axis" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtShort(s.date) + '</text>';
      out += '<rect class="hit" x="' + (left + band * i) + '" y="' + top + '" width="' + band + '" height="' + ph + '" data-tip="' + esc(fmtD(s.date, true) + ' · ' + s.present + '명 출석' + (s.elig ? ' (' + pct(s.present / s.elig) + ')' : '')) + '" data-x="' + cx + '" data-y="' + y + '"/>';
    });
    return out + '</svg><div class="tip" id="tip"></div></div>';
  }

  function bindChart() {
    var c = document.getElementById('chart');
    if (!c) return;
    var tip = document.getElementById('tip'), svgEl = c.querySelector('svg');
    function show(e) {
      var r = e.target.closest('.hit');
      if (!r) { tip.style.opacity = 0; return; }
      var scale = svgEl.getBoundingClientRect().width / 340;
      tip.textContent = r.getAttribute('data-tip');
      tip.style.left = (+r.getAttribute('data-x') * scale) + 'px';
      tip.style.top = (+r.getAttribute('data-y') * scale) + 'px';
      tip.style.opacity = 1;
    }
    c.addEventListener('pointerover', show);
    c.addEventListener('pointerdown', show);
    c.addEventListener('pointerleave', function () { tip.style.opacity = 0; });
  }

  /* ======================= 새 기능 모음 ======================= */

  /* ---------- 새 소식 빨간 점: 기기에 "마지막으로 본 시각"을 남겨 두고, 그 뒤에 생긴 것만 세요 ---------- */
  var SEEN_KEYS = ['notices', 'events', 'bulletins', 'polls', 'prayer', 'board', 'visit', 'talent'];
  function unreadItems(k) {
    var d = state.data, me = d.me, out = [];
    var notMine = function (x, idKey) { return x[idKey || 'authorId'] !== me.id; };
    if (k === 'notices') out = (d.notices || []).filter(function (x) { return notMine(x); }).map(function (x) { return x.createdAt; });
    else if (k === 'events') out = (d.events || []).filter(function (x) { return notMine(x); }).map(function (x) { return x.createdAt || ''; });
    else if (k === 'bulletins') out = (d.bulletins || []).filter(function (x) { return notMine(x); }).map(function (x) { return x.updatedAt || ''; });
    else if (k === 'polls') out = (d.polls || []).filter(function (x) { return !x.mine; }).map(function (x) { return x.createdAt; });
    else if (k === 'prayer') out = (d.prayers || []).filter(function (x) { return !x.mine; }).map(function (x) { return x.createdAt; });
    else if (k === 'board') out = (d.posts || []).filter(function (x) { return !x.mine; }).map(function (x) { return x.createdAt; });
    else if (k === 'visit') out = (d.visits || []).filter(function (v) {
      return isT() ? v.status === 'pending' && !v.mine : v.mine && v.handledBy && v.handledBy.indexOf('본인 취소') < 0;
    }).map(function (v) { return isT() ? v.createdAt : v.updatedAt; });
    else if (k === 'talent' && !isT() && d.talent) out = (d.talent.myRedemptions || []).filter(function (x) { return x.handledBy && x.status !== 'pending'; }).map(function (x) { return x.updatedAt || x.createdAt; });
    return out.filter(Boolean);

  function seenObj() {

      o = {}; SEEN_KEYS.forEach(function (k) { o[k] = unreadItems(k).sort().pop() || '0'; });
      LS.set(key, o);

  }
  function unreadN(k) { var o = seenObj(), t = o[k] || '0'; return unreadItems(k).filter(function (x) { return x > t; }).length; }
  function markSeen(k) {
    var o = seenObj(), last = unreadItems(k).sort().pop() || '';

    if (tab === 'prayer') return unreadN('prayer') + unreadN('board') + unreadN('visit');

  /* ---------- 공지 카톡으로 보내기: 휴대폰 공유창(카톡 선택) · 안 되면 글을 복사해요 ---------- */
  function appLink(hash) { return location.href.split('#')[0] + (hash ? '#' + hash : ''); }
  function shareText(title, body, link) {
    var cut = String(body || '').replace(/\s+/g, ' ').trim();
    if (cut.length > 90) cut = cut.slice(0, 90) + '…';
    return '[' + CONFIG.DEPT + ' 공지] ' + title + (cut ? '\n' + cut : '') + '\n\n앱에서 보기: ' + link;
  }
  function copyText(text) {
    var done = function () { toast('복사했어요. 카톡 대화방에 붙여 넣어 주세요 '); };
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    fallbackCopy(text); done();
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove();
  }
  function shareOut(title, text) {
    if (navigator.share) navigator.share({ title: title, text: text }).catch(function (e) { if (!e || e.name !== 'AbortError') copyText(text); });

  }

  /* ---------- 휴대폰 점검: 사진 인증·설치가 이 기기에서 되는지 한 번에 확인 ---------- */

    else add('ok', '브라우저', di.isIOS ? '사파리 · 좋아요' : di.isAndroid ? '안드로이드 브라우저 · 좋아요' : '컴퓨터 브라우저예요');
    // 2) 홈 화면 앱
    add(di.standalone ? 'ok' : 'info', '홈 화면 앱', di.standalone ? '홈 화면 아이콘으로 실행 중이에요' : (di.isIOS ? '사파리 공유 버튼(□↑) → 홈 화면에 추가' : '브라우저 메뉴(⋮) → 홈 화면에 추가') + '를 하면 앱처럼 열려요.');
    // 3) 저장 공간 (로그인 유지)
    var ls = false; try { localStorage.setItem('jgb:check', '1'); ls = localStorage.getItem('jgb:check') === '1'; localStorage.removeItem('jgb:check'); } catch (e) { }
    add(ls ? 'ok' : 'bad', '로그인 유지', ls ? '이 기기에 로그인 정보를 저장할 수 있어요' : '저장 공간을 못 써요. 사생활 보호(시크릿) 모드를 끄거나 다른 브라우저로 열어 주세요.');
    // 4) 카메라 바로 찍기
    var cap = 'capture' in document.createElement('input');
    add(cap ? 'ok' : 'info', '카메라 바로 찍기', cap ? '사진 인증 버튼을 누르면 카메라가 바로 열려요' : '이 기기에서는 사진 고르기 창이 열려요 (컴퓨터라면 정상이에요)');
    // 5) 사진 압축 (실제 압축 함수로 시험)
    var c = document.createElement('canvas'); c.width = 1600; c.height = 1200;
    var g = c.getContext('2d'); g.fillStyle = '#4a7'; g.fillRect(0, 0, 1600, 1200); g.fillStyle = '#fff'; g.fillRect(500, 300, 600, 600);
    var p1 = new Promise(function (resolve) {
      if (!c.toBlob) { add('bad', '사진 줄이기', '이 브라우저는 사진을 줄일 수 없어요. 최신 브라우저로 열어 주세요.'); return resolve(); }
      c.toBlob(function (blob) {
        if (!blob) { add('bad', '사진 줄이기', '사진을 만들지 못했어요.'); return resolve(); }
        blob.lastModified = Date.now();
        compressProofImage(new File([blob], 'test.png', { type: 'image/png', lastModified: Date.now() }), 1024).then(function (r) {
          var kb = Math.round(r.photo.length * 0.75 / 1024);
          add(r.photo.indexOf('data:image/jpeg') === 0 ? 'ok' : 'warn', '사진 줄이기', '1600×1200 → 1024×768 JPEG ' + kb + 'KB로 줄였어요 (서버 한도 1.5MB)');
          resolve();
        }, function (e) { add('bad', '사진 줄이기', e.message); resolve(); });
      }, 'image/png');
    });
    // 6) 서버 연결
    var p2 = new Promise(function (resolve) {
      if (MODE !== 'live') { add('info', '서버 연결', '데모 모드예요 (이 기기에만 저장)'); return resolve(); }

    });

  /* ---------------- 날짜 칸: 앱 미니 달력 ----------------
   * 모든 input[type=date]는 그대로 두고(값·이름·change 흐름 유지) 화면에서만 숨겨요.
   * 바로 뒤에 같은 모양의 버튼을 붙여 "2026년 11월 29일 (일)"처럼 보여 주고, 누르면 미니 달력이 열려요.
   * 날짜를 고르면 input.value(YYYY-MM-DD)를 채우고 input·change 이벤트를 보내요 (data-change="attDate", 만 14세 판별 등 그대로 동작). */
  var DP = { el: null, ym: '', birth: false };

  }
  function dpSync(inp) {
    var f = inp._dpFace; if (!f) return;

    f.querySelector('.dp-t').textContent = lab || inp.getAttribute('placeholder') || (inp.name === 'birth' ? '생년월일 선택' : '날짜 선택');
    f.classList.toggle('empty', !lab);
    f.disabled = inp.disabled;
  }
  function dpEnhance(inp) {
    if (inp._dpFace || inp.type !== 'date') return;
    var f = document.createElement('button');
    f.type = 'button';
    f.className = (inp.className || 'in') + ' dp-face';

    f.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); dpOpen(inp); });

    inp.classList.add('dp-hide');

  function dpOpen(inp) {
    if (inp.disabled) return;

    DP.el = inp; DP.birth = inp.name === 'birth';
    var base = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : (inp.min && inp.min > t ? inp.min : inp.max && inp.max < t ? inp.max : DP.birth ? (+t.slice(0, 4) - 15) + t.slice(4) : t);

  function dpDraw() {

    var cur = DP_DESC.get.call(inp), mn = inp.min || '', mx = inp.max || (DP.birth ? t : '');
    var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    var prevOk = !mn || ymAdd(ym, -1) >= mn.slice(0, 7), nextOk = !mx || ymAdd(ym, 1) <= mx.slice(0, 7);
    if (DP.birth) { prevOk = prevOk && ym > '1950-01'; nextOk = nextOk && ym < t.slice(0, 7); }

      var y0 = Math.min(1950, y), ys = '';

      var ms = ''; for (var mi = 1; mi <= 12; mi++) ms += '<option value="' + mi + '"' + (mi === m ? ' selected' : '') + '>' + mi + '월</option>';
      head = '<button type="button" class="dp-nav" data-dp="-1"' + (prevOk ? '' : ' disabled') + ' aria-label="이전 달">‹</button>' +
        '<select class="in" id="dpY" aria-label="연도">' + ys + '</select><select class="in" id="dpM" aria-label="월">' + ms + '</select>' +
        '<button type="button" class="dp-nav" data-dp="1"' + (nextOk ? '' : ' disabled') + ' aria-label="다음 달">›</button>';
    } else {

    }
    var g = '';
    for (var i = 0; i < first; i++) g += '<span></span>';
    for (var dd = 1; dd <= days; dd++) {
      var ds = ym + '-' + ('0' + dd).slice(-2), w = (first + dd - 1) % 7, off = (mn && ds < mn) || (mx && ds > mx);
      g += '<button type="button" class="mcal-d' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') + (ds === cur ? ' sel' : '') + (ds === t ? ' today' : '') + '" data-dpd="' + ds + '"' + (off ? ' disabled' : '') + '><b>' + dd + '</b></button>';
    }
    var lab = (inp.closest('label') && inp.closest('label').querySelector('span')) ? inp.closest('label').querySelector('span').textContent.replace(/\s*\*$/, '') : '';
    sh.innerHTML = '<div class="dp-shade" data-dpx="1"><div class="dp-pop" role="dialog" aria-label="날짜 고르기">' +
      (lab ? '<div class="sub" style="text-align:center;margin:-2px 0 8px">' + esc(lab) + (cur ? ' · ' + dpLabel(cur) : '') + '</div>' : '') +
      '<div class="dp-head">' + head + '</div>' +
      '<div class="mcal dp-grid"><div class="mcal-h">' + DOW.map(function (wd, i) { return '<span class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + wd + '</span>'; }).join('') + '</div><div class="mcal-g">' + g + '</div></div>' +
      '<div class="dp-foot">' + (dpCanClear(inp) ? '<button type="button" class="btn line sm" data-dpclear="1">날짜 지우기</button>' : '') +
      ((!mn || t >= mn) && (!mx || t <= mx) && !DP.birth ? '<button type="button" class="btn line sm" data-dpd="' + t + '">오늘</button>' : '') +
      '<button type="button" class="btn sm" data-dpx="1">닫기</button></div></div></div>';
    var sy = sh.querySelector('#dpY'), sm = sh.querySelector('#dpM');

  }
  // 비워 둬도 되는 칸에만 [날짜 지우기]: 종료일 · 마감일 · 생년월일 · 희망 날짜 · 특새 끝 날짜 (출석 날짜처럼 꼭 있어야 하는 칸은 빼요)
  var DP_CLEAR = ['birth', 'prefDate', 'endDate', 'deadline'];
  function dpCanClear(inp) { return !inp.required && (DP_CLEAR.indexOf(inp.name) >= 0 || inp.id === 'sdTo' || inp.id === 'rgTo' || inp.id === 'snDate'); }
  function dpSet(v) {
    var inp = DP.el; if (!inp) return;
    var old = DP_DESC.get.call(inp);
    inp.value = v;

    if (old !== v) {

  document.addEventListener('click', function (e) {

  /* ---------------- 연락처: 숫자만 쳐도 "-"가 저절로 (010-1234-5678 · 02-123-4567) ---------------- */
  // done: 다 친 뒤(칸을 벗어날 때)에는 10자리 옛 번호(011-123-4567)도 바르게 맞춰요
  function phoneFmt(v, done) {
    var d = String(v || '').replace(/[^0-9]/g, '').slice(0, 11);
    if (/^02/.test(d)) {
      if (d.length <= 2) return d;
      if (d.length <= 5) return d.slice(0, 2) + '-' + d.slice(2);
      if (d.length <= 9) return d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5);
      return d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6, 10);
    }
    if (d.length <= 3) return d;
    if (/^01/.test(d) && !done) { // 휴대폰: 치는 동안에도 010-1234-5678 모양으로
      if (d.length <= 7) return d.slice(0, 3) + '-' + d.slice(3);
      return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    }
    if (d.length <= 6) return d.slice(0, 3) + '-' + d.slice(3);
    if (d.length <= 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  }

  }, true);

    var el = e.target;
